#cloud-config
# Render with deploy/scripts/render-cloud-init.sh. Unrendered placeholders make
# provisioning fail closed.
hostname: cuadrabot-executor-prod-1
manage_etc_hosts: true
timezone: UTC
package_update: true
package_upgrade: true

users:
  - default
  - name: cuadrabot
    uid: 10001
    gecos: CuadraBot deploy operator
    shell: /bin/bash
    lock_passwd: true
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - __ADMIN_SSH_PUBLIC_KEY__
  - name: cuadraexec
    uid: 10002
    gecos: CuadraBot trusted executor control plane
    shell: /bin/bash
    lock_passwd: true
  - name: cuadraworker
    uid: 10003
    gecos: CuadraBot queue worker
    shell: /usr/sbin/nologin
    lock_passwd: true
    no_create_home: true
  - name: cuadracron
    uid: 10004
    gecos: CuadraBot maintenance caller
    shell: /usr/sbin/nologin
    lock_passwd: true
    no_create_home: true

ssh_pwauth: false
disable_root: true

packages:
  - auditd
  - ca-certificates
  - curl
  - dbus-user-session
  - fail2ban
  - fuse-overlayfs
  - git
  - gnupg
  - jq
  - needrestart
  - restic
  - slirp4netns
  - uidmap
  - ufw
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/60-cuadrabot-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      AllowUsers cuadrabot
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding no
      PermitTunnel no
      PermitUserEnvironment no

  - path: /etc/fail2ban/jail.d/sshd.local
    owner: root:root
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52cuadrabot-unattended-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

  - path: /etc/systemd/system/user@.service.d/delegate.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Service]
      Delegate=cpu cpuset io memory pids

  - path: /etc/sysctl.d/60-cuadrabot-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      fs.protected_fifos=2
      fs.protected_hardlinks=1
      fs.protected_regular=2
      fs.protected_symlinks=1
      kernel.dmesg_restrict=1
      kernel.kptr_restrict=2
      kernel.unprivileged_bpf_disabled=1
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.default.accept_redirects=0
      net.ipv4.conf.default.send_redirects=0
      net.ipv6.conf.all.accept_redirects=0
      net.ipv6.conf.default.accept_redirects=0

runcmd:
  - [bash, -lc, "case '__ADMIN_SSH_CIDR__' in __*) exit 90;; esac"]
  - [bash, -lc, "sshd -t"]
  - [systemctl, restart, ssh]
  - [systemctl, enable, --now, fail2ban]
  - [systemctl, enable, --now, unattended-upgrades]
  - [systemctl, enable, --now, auditd]
  - [loginctl, enable-linger, cuadraexec]
  - [ufw, --force, reset]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, from, __ADMIN_SSH_CIDR__, to, any, port, "22", proto, tcp]
  - [ufw, logging, low]
  - [ufw, --force, enable]
  - [sysctl, --system]
  - [systemctl, daemon-reload]

final_message: "CuadraBot base hardening complete. Run bootstrap-host.sh next."
