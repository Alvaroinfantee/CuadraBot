[project]
name = "drawing-takeoff-microservice"
version = "1.0.0"
description = "Codex-powered construction drawing takeoff API with Excel and annotated PDF outputs"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.8",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pydantic==2.13.4",
  "pypdf==6.14.2",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.39.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
